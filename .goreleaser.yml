version: 2

before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    ldflags:
      - "-s"
      - "-w"
      - "-X github.com/fmotalleb/go-tools/git.Version={{.Version}}"
      - "-X github.com/fmotalleb/go-tools/git.Commit={{.ShortCommit}}"
      - "-X github.com/fmotalleb/go-tools/git.Date={{.Date}}"
      - "-X github.com/fmotalleb/go-tools/git.Branch={{.Branch}}"
    goarch:
      - amd64
      - arm64

dockers:
  - image_templates:
      - "ghcr.io/fmotalleb/rakhsh:latest"
      - "ghcr.io/fmotalleb/rakhsh:{{ .Major }}"
      - "ghcr.io/fmotalleb/rakhsh:{{ .Major }}.{{ .Minor }}"
      - "ghcr.io/fmotalleb/rakhsh:{{ .Major }}.{{ .Minor }}.{{ .Patch }}"
    build_flag_templates:
      - "--pull"
      # OCI annotations: https://github.com/opencontainers/image-spec/blob/main/annotations.md
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"
release:
  github:
    name: rakhsh
    owner: fmotalleb
  name_template: "{{.Version}}"
  prerelease: auto
  mode: append
changelog:
  disable: true
